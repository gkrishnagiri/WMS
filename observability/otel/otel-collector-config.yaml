receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  debug:
    verbosity: basic

  prometheus:
    endpoint: 0.0.0.0:8889

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - prometheus
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - otlp/tempo
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - otlphttp/loki

  extensions:
    - health_check

  telemetry:
    logs:
      level: info
